# SPDX-License-Identifier: GPL-3.0-only
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kapa-runtime"
version = "0.1.0.dev0"
description = "KAPA public-data collection, normalization, controlled data release and local workflow-state runtime"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "pyarrow>=18",
  "tzdata>=2024.1",
  "duckdb>=1.1,<2",
  "huggingface_hub>=0.26,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
mcp = ["mcp==2.3.0"]

[project.scripts]
kapa-runtime = "kapa_runtime.cli:main"
kapa-runtime-mcp = "kapa_runtime.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kapa_runtime = ["registry/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy pipeline, promotion, attestation and review integration tests"]
